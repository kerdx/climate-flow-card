save_program:
  name: Save program
  description: Create or replace the weekly program for one climate entity.
  fields:
    climate_entity:
      name: Climate entity
      description: Climate entity to schedule.
      required: true
      selector:
        entity:
          domain: climate
    enabled:
      name: Enabled
      description: Whether the saved program is enabled.
      required: true
      selector:
        boolean:
    slots:
      name: Time slots
      description: >-
        Weekly slots. Each slot requires id, days (1 Monday to 7 Sunday), start and end (HH:MM), and exactly one target form:
        temperature, or target_temp_low with target_temp_high for heat_cool.
      required: true
      example: '[{"id":"weekday-morning","days":[1,2,3,4,5],"start":"06:30","end":"08:00","temperature":20}]'
    away_temperature:
      name: Outside schedule temperature
      description: Optional single target applied outside the scheduled slots. It cannot be used while the program runs heat_cool. Omit or leave empty to keep the last target (no call outside slots).
      required: false
      example: 17
    hvac_mode:
      name: HVAC mode
      description: Optional mode the program sets for single-target slots while enabled. Omit to leave the current mode alone. A range slot switches to heat_cool and back to this mode; mixed single/range schedules require this mode. A heat_cool program requires every slot to carry both targets.
      required: false
      selector:
        select:
          options:
            - "off"
            - heat
            - cool
            - auto
            - dry
            - fan_only
            - heat_cool
set_enabled:
  name: Set program enabled
  description: Enable or disable the saved program for one climate entity.
  fields:
    climate_entity:
      name: Climate entity
      description: Climate entity whose program to update.
      required: true
      selector:
        entity:
          domain: climate
    enabled:
      name: Enabled
      description: Whether the program is enabled.
      required: true
      selector:
        boolean:
delete_program:
  name: Delete program
  description: Delete the saved program for one climate entity.
  fields:
    climate_entity:
      name: Climate entity
      description: Climate entity whose program to delete.
      required: true
      selector:
        entity:
          domain: climate
set_manual_override:
  name: Set temporary manual override
  description: Apply a validated target until its duration expires or the next schedule boundary.
  fields:
    climate_entity:
      name: Climate entity
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Target temperature
      required: true
      selector:
        number:
          min: -50
          max: 100
          step: any
          mode: box
    step:
      name: Target temperature step override
      description: Optional explicit card step; defaults to the climate entity native step.
      required: false
      example: 0.5
    duration:
      name: Duration
      required: true
      selector:
        select:
          options:
            - "30m"
            - "1h"
            - "2h"
            - next_change
set_pause:
  name: Pause program (vacation)
  description: Hold one target for a number of days, then resume the weekly program automatically.
  fields:
    climate_entity:
      name: Climate entity
      description: Climate entity whose program to pause.
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Pause target
      description: Target applied while the program is paused; it must sit on the climate temperature grid.
      required: true
      selector:
        number:
          min: -50
          max: 100
          step: any
          mode: box
    duration:
      name: Pause length
      description: How long the schedule stays paused; it resumes on its own when the pause expires.
      required: true
      selector:
        select:
          options:
            - "1d"
            - "3d"
            - "7d"
            - "14d"
            - "30d"
resume_program:
  name: Resume schedule
  description: Clear the manual override and the vacation pause, then immediately evaluate the program.
  fields:
    climate_entity:
      name: Climate entity
      required: true
      selector:
        entity:
          domain: climate
