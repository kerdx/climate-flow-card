name: Hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hassfest:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v7"
      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"
